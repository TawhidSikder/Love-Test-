<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">

<style>
:root{--plum:#2b1030;--rose:#e8456b;--blush:#ffe3ea;--gold:#f6b24a;--paper:#fff8f5;--sun:#fff0d6;--line:#ecd3d9}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Hind Siliguri",system-ui,sans-serif;background:var(--paper);color:var(--plum);line-height:1.6}
h1,h2,h3{font-family:"Tiro Bangla",serif;font-weight:400;margin:0}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,var(--blush),transparent 55%),radial-gradient(circle at 85% 90%,var(--sun),transparent 50%)}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:36px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px -25px rgba(43,16,48,.35)}
.card h1{font-size:2.2rem;line-height:1.25;margin-bottom:8px}
.card p{margin:0 0 22px;opacity:.75}
.big{font-size:3rem;letter-spacing:6px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;margin-top:12px;border-radius:14px;border:1.5px solid var(--plum);background:#fff;cursor:pointer;font-weight:500}
.sbtn.fb{background:#1877f2;border-color:#1877f2;color:#fff}
.sbtn.demo{border-style:dashed;opacity:.8}
.note{font-size:.85rem;margin-top:16px;opacity:.65}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
header.top b{font-family:"Tiro Bangla",serif;font-size:1.25rem;font-weight:400}
.who{display:flex;align-items:center;gap:8px;font-size:.9rem}
.who img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.lnk{background:none;border:0;color:var(--rose);cursor:pointer;font-weight:600;padding:4px 8px}
.langbtn{border:1.5px solid var(--plum);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:.85rem}
.card .langbtn{margin-bottom:14px}
main{max-width:1000px;margin:0 auto;padding:28px 16px 70px}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.2}
.hero p{margin:8px 0 0;opacity:.75}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{border-radius:26px;padding:22px 18px;border:1px solid var(--line)}
.panel.a{background:var(--blush)}
.panel.b{background:var(--sun)}
.panel h2{text-align:center;font-size:1.5rem;margin-bottom:14px}
.avatar{width:112px;height:112px;margin:0 auto 12px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 0 0 3px var(--rose);display:grid;place-items:center;font-size:2.6rem;overflow:hidden}
.b .avatar{box-shadow:0 0 0 3px var(--gold)}
.avatar img{width:100%;height:100%;object-fit:cover}
.pick{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.fin{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.pbtn{padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;font-size:.9rem}
.fld{margin-bottom:14px}
.fld>label{display:block;font-weight:600;font-size:.95rem;margin-bottom:6px}
.fld .hint{font-weight:400;font-size:.82rem;opacity:.65}
.txt,select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.dob{display:grid;grid-template-columns:1fr 1.3fr 1.1fr;gap:6px}
.agebox{margin-top:8px;font-size:.9rem;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:.92rem}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.shared{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px 18px}
.shared h2{text-align:center;font-size:1.4rem;margin-bottom:14px}
.go{display:block;margin:26px auto 0;padding:16px 44px;border:0;border-radius:999px;background:var(--rose);color:#fff;font-size:1.25rem;font-weight:600;cursor:pointer;box-shadow:0 14px 28px -12px var(--rose)}
.go:active{transform:scale(.97)}
.hist{margin-top:46px}
.hist h2{font-size:1.5rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:10px}
.row .th{display:flex}
.row .th img,.row .th i{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:var(--blush);display:grid;place-items:center;font-style:normal}
.row .th>*+*{margin-left:-12px}
.row .tx{flex:1;min-width:0}
.row .tx small{display:block;opacity:.65}
.row strong{font-family:"Tiro Bangla",serif;font-size:1.5rem;color:var(--rose);font-weight:400}
.empty{text-align:center;opacity:.6;padding:18px}
.overlay{position:fixed;inset:0;background:rgba(43,16,48,.78);display:grid;place-items:start center;padding:16px;z-index:20;overflow:auto}
.res{background:var(--paper);border-radius:30px;padding:26px 18px;max-width:440px;width:100%;text-align:center;margin:auto}
.duo{display:flex;align-items:center;justify-content:center;gap:14px}
.duo .avatar{width:84px;height:84px;margin:0;font-size:2rem}
.ring{--p:0;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rose) calc(var(--p)*1%),#f3d6dc 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:"Tiro Bangla",serif;font-size:2.4rem}
.res h3{font-size:1.3rem;margin:16px 0 4px}
.rtitle{display:inline-block;background:var(--rose);color:#fff;border-radius:999px;padding:4px 16px;margin:6px 0 10px;font-weight:600}
.res p{margin:0 0 14px}
.bars{text-align:left;margin:0 0 14px}
.bar{margin-bottom:8px;font-size:.9rem}
.bar span{display:flex;justify-content:space-between}
.bar i{display:block;height:8px;border-radius:99px;background:#f3d6dc;overflow:hidden;margin-top:3px}
.bar i b{display:block;height:100%;width:0;border-radius:99px;background:var(--rose);transition:width 1.4s ease}
.tip{background:var(--sun);border-radius:16px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.acts button{padding:11px 20px;border-radius:999px;border:1.5px solid var(--plum);background:#fff;cursor:pointer;font-weight:600}
.acts .p{background:var(--rose);border-color:var(--rose);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--plum);color:#fff;padding:12px 20px;border-radius:14px;z-index:40;max-width:90%;text-align:center}
.petal{position:fixed;top:-30px;z-index:25;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.7}}
@media(max-width:760px){.panels{grid-template-columns:1fr}.duo{gap:6px}.ring{width:124px;height:124px}.ring div{width:96px;height:96px;font-size:2rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.petal{display:none}.bar i b{transition:none}}
</style>
</head>

  [40, {bn:"ভালোবাসার বীজ 🌿", en:"Seed of love 🌿"}, {bn:"ভালোবাসার বীজ আছে, শুধু যত্ন দরকার।", en:"The seed of love is there, it just needs care."}],
  [60, {bn:"প্রাণের বন্ধু 🤝", en:"Heart friends 🤝"}, {bn:"মাঝারি মিল। একসাথে সময় কাটালে এটা আরও বাড়বে।", en:"A decent match. Spending more time together will grow it."}],
  [80, {bn:"মনের মানুষ 💞", en:"Close hearts 💞"}, {bn:"দারুণ বোঝাপড়া! আপনাদের মধ্যে সত্যিই টান আছে।", en:"Great understanding! There is a real bond between you."}],
  [95, {bn:"সোলমেট ✨", en:"Soulmates ✨"}, {bn:"অসাধারণ জুটি! এমন ভালোবাসা খুব কম দেখা যায়।", en:"A wonderful pair! Love like this is rare."}],
  [100, {bn:"পারফেক্ট ম্যাচ 💯", en:"Perfect match 💯"}, {bn:"আপনারা একে অপরের জন্যই তৈরি।", en:"You two were made for each other."}]
];
const resFor = p => TITLES.find(x => p <= x[0]);
const BARS = [{bn:"বোঝাপড়া 🤝", en:"Understanding 🤝"},{bn:"বিশ্বাস 🔒", en:"Trust 🔒"},{bn:"মজার মুহূর্ত 😄", en:"Fun moments 😄"}];
const TIPS = {
  0: {bn:"আজ ওকে সময় দিন, ফোন সরিয়ে একসাথে বসে গল্প করুন।", en:"Give them your time today. Put the phone away and just talk."},
  1: {bn:"ছোট একটা উপহার দিয়ে অবাক করে দিন।", en:"Surprise them with a small gift."},
  2: {bn:"আজ একটা মিষ্টি কথা বলুন, যেটা অনেকদিন বলা হয়নি।", en:"Say one kind thing you haven't said in a long time."},
  3: {bn:"ওর খোঁজখবর নিন, খেয়েছে কি না জিজ্ঞেস করুন।", en:"Check in on them. Ask if they have eaten."},
  4: {bn:"একসাথে কোথাও ঘুরতে যাওয়ার পরিকল্পনা করুন।", en:"Plan a little trip together."},
  5: {bn:"হঠাৎ একটা সারপ্রাইজের ব্যবস্থা করুন।", en:"Plan a sudden surprise."},
  6: {bn:"একটা আন্তরিক আলিঙ্গন সব কথার চেয়ে বেশি বলে।", en:"A warm hug says more than words."},
  7: {bn:"ওর একটা কাজ নিজে থেকে করে দিন।", en:"Take one task off their plate today."},
  8: {bn:"আজ শুধু শুনুন, মাঝখানে থামাবেন না।", en:"Today, just listen. Don't interrupt."},
  9: {bn:"ওকে জানিয়ে দিন যে আপনি সবসময় পাশে আছেন।", en:"Let them know you are always there."}
};

/* ---------------- Build form ---------------- */
function chipsHtml(s, k, multi) {
  return `<div class="chips">${OPT[k][lang].map((v, i) => `<button type="button" class="chip${isOn(s, k, i, multi) ? " on" : ""}" data-s="${s}" data-k="${k}" data-i="${i}" ${multi ? 'data-multi="1"' : ""}>${v}</button>`).join("")}</div>`;
}
function isOn(s, k, i, multi) {
  const v = S[s][k];
  return multi ? Array.isArray(v) && v.includes(i) : v === i;
}
function dobHtml(s) {
  const d = S[s].dd || "", m = S[s].mm || "", y = S[s].yy || "", now = new Date().getFullYear();
  const days = Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}"${+d === i + 1 ? " selected" : ""}>${num(i + 1)}</option>`).join("");
  const months = MONTHS[lang].map((n, i) => `<option value="${i + 1}"${+m === i + 1 ? " selected" : ""}>${n}</option>`).join("");
  const years = Array.from({ length: 100 }, (_, i) => now - i).map(v => `<option value="${v}"${+y === v ? " selected" : ""}>${num(v)}</option>`).join("");
  return `<div class="dob">
    <select data-s="${s}" data-dob="dd"><option value="">${t("day")}</option>${days}</select>
    <select data-s="${s}" data-dob="mm"><option value="">${t("month")}</option>${months}</select>
    <select data-s="${s}" data-dob="yy"><option value="">${t("year")}</option>${years}</select></div>`;
}
function ageHtml(s) {
  const a = S[s].age || "";
  const opts = Array.from({ length: 99 }, (_, i) => `<option value="${i + 1}"${+a === i + 1 ? " selected" : ""}>${num(i + 1)} ${t("yrs")}</option>`).join("");
  return `<select data-s="${s}" data-age="1"><option value="">${t("ageSel")}</option>${opts}</select>`;
}
function panelHtml(s) {
  return `<section class="panel ${s}">
    <h2>${s === "a" ? t("me") : t("partner")}</h2>
    <div class="avatar" id="av-${s}">${S[s].photo ? `<img alt="" src="${S[s].photo}">` : (s === "a" ? "🌸" : "🌼")}</div>
    <div class="pick">
      <button type="button" class="pbtn" data-open="g-${s}">${t("gallery")}</button>
      <button type="button" class="pbtn" data-open="c-${s}">${t("camera")}</button>
      <input type="file" accept="image/*" class="fin" id="g-${s}" data-photo="${s}">
      <input type="file" accept="image/*" capture="user" class="fin" id="c-${s}" data-photo="${s}">
    </div>
    <div class="fld"><label>${s === "a" ? t("yourName") : t("partnerName")}</label><input class="txt" data-s="${s}" data-name="1" placeholder="${t("namePh")}" maxlength="30" value="${esc(S[s].name || "")}"></div>
    <div class="fld"><label>${t("dob")}</label>${dobHtml(s)}</div>
    <div class="fld"><label>${t("age")} <span class="hint">${t("ageOr")}</span></label>${ageHtml(s)}</div>
    <div class="fld"><label>${t("blood")}</label>${chipsHtml(s, "blood")}</div>
    <div class="fld"><label>${t("work")}</label>${chipsHtml(s, "work")}</div>
    <div class="fld"><label>${t("loveLang")} <span class="hint">${t("loveHint")}</span></label>${chipsHtml(s, "love", true)}</div>
  </section>`;
}
function build() {
  document.documentElement.lang = lang;
  document.title = t("appName");
  $("#panels").innerHTML = panelHtml("a") + panelHtml("b");
  $("#shared").innerHTML = `<h2>${t("sharedTitle")} 💑</h2>
    <div class="fld"><label>${t("rel")}</label>${chipsHtml("x", "rel")}</div>
    <div class="fld"><label>${t("dur")}</label>${chipsHtml("x", "dur")}</div>
    <div class="fld"><label>${t("freq")}</label>${chipsHtml("x", "freq")}</div>`;
  $$("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $$("[data-lang-toggle]").forEach(el => { el.textContent = t("langBtn"); });
  $("#liveNote").textContent = LIVE ? "" : t("liveNote");
  if (user) $("#uName").textContent = user.name || t("guest");
  drawHist();
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------------- Inputs ---------------- */
function calcAge(s) {
  const { dd, mm, yy } = S[s];
  if (!dd || !mm || !yy) return;
  const n = new Date();
  let a = n.getFullYear() - +yy;
  if (n.getMonth() + 1 < +mm || (n.getMonth() + 1 === +mm && n.getDate() < +dd)) a--;
  if (a < 1) a = 1;
  S[s].age = a;
  const sel = document.querySelector(`select[data-s="${s}"][data-age]`);
  if (sel) sel.value = a;
}
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]");
  if (o) { const f = document.getElementById(o.dataset.open); if (f) { f.value = ""; f.click(); } return; }
  const c = e.target.closest(".chip");
  if (!c) return;
  const { s, k } = c.dataset, i = +c.dataset.i;
  if (c.dataset.multi) {
    const arr = S[s][k] || (S[s][k] = []);
    const at = arr.indexOf(i);
    if (at >= 0) { arr.splice(at, 1); c.classList.remove("on"); }
    else if (arr.length >= LOVE_MAX) { toast(t("maxLove")); }
    else { arr.push(i); c.classList.add("on"); }
  } else {
    $$(`.chip[data-s="${s}"][data-k="${k}"]`).forEach(x => x.classList.remove("on"));
    c.classList.add("on");
    S[s][k] = i;
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && el.dataset.name) S[el.dataset.s].name = el.value.trim();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.photo && el.files[0]) return pickPhoto(el.dataset.photo, el.files[0]);
  if (el.dataset.dob) { S[el.dataset.s][el.dataset.dob] = el.value; calcAge(el.dataset.s); }
  if (el.dataset.age) S[el.dataset.s].age = el.value;
});
function pickPhoto(s, file) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const z = 220, cv = document.createElement("canvas");
      cv.width = cv.height = z;
      const m = Math.min(img.width, img.height);
      cv.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, z, z);
      S[s].photo = cv.toDataURL("image/jpeg", 0.75);
      $("#av-" + s).innerHTML = `<img alt="" src="${S[s].photo}">`;
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
function toast(m) {
  const d = document.createElement("div");
  d.className = "toast"; d.textContent = m;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}

/* ---------------- Language ---------------- */
$$("[data-lang-toggle]").forEach(b => b.onclick = () => {
  lang = lang === "bn" ? "en" : "bn";
  localStorage.setItem("lt_lang", lang);
  build();
});

/* ---------------- Run test ---------------- */
function petals() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const set = ["🌸", "🌼", "💗", "🌷", "✨"];
  for (let i = 0; i < 26; i++) {
    const p = document.createElement("div");
    p.className = "petal";
    p.textContent = set[i % set.length];
    p.style.left = Math.random() * 100 + "vw";
    p.style.fontSize = 16 + Math.random() * 18 + "px";
    p.style.animationDuration = 3 + Math.random() * 3 + "s";
    p.style.animationDelay = Math.random() * 1.2 + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 7500);
  }
}
const avHtml = (ph, ic) => ph ? `<img alt="" src="${ph}">` : ic;
const optText = (k, i) => i == null ? "" : OPT[k][lang][i];

function runTest() {
  if (!S.a.name || !S.b.name) return toast(t("needNames"));
  if (S.x.rel == null) return toast(t("needRel"));
  if ((S.a.love || []).length < LOVE_MIN || (S.b.love || []).length < LOVE_MIN) return toast(t("needLove"));
  const p = Math.floor(Math.random() * 100) + 1;
  const parts = BARS.map(() => Math.floor(Math.random() * 61) + 40);
  const common = (S.a.love || []).filter(i => (S.b.love || []).includes(i));
  const tipIdx = common.length ? common[0] : S.a.love[0];
  last = { id: Date.now(), p, parts, tipIdx, an: S.a.name, bn: S.b.name, rel: S.x.rel,
           ap: S.a.photo || "", bp: S.b.photo || "",
           aAge: S.a.age || "", bAge: S.b.age || "",
           aDob: S.a.dd && S.a.mm ? [S.a.dd, S.a.mm] : null, bDob: S.b.dd && S.b.mm ? [S.b.dd, S.b.mm] : null };
  showResult(last, true);
  const h = loadHist(); h.unshift(last); saveHist(h.slice(0, 30)); drawHist();
}
function showResult(x, animate) {
  const r = resFor(x.p);
  $("#rA").innerHTML = avHtml(x.ap, "🌸");
  $("#rB").innerHTML = avHtml(x.bp, "🌼");
  $("#rNames").textContent = `${x.an} ❤ ${x.bn} (${OPT.rel[lang][x.rel]})`;
  $("#rTitle").textContent = r[1][lang];
  $("#rMsg").textContent = r[2][lang];
  let extra = "";
  if (x.aAge && x.bAge) extra += `${t("ageDiff")}: ${num(Math.abs(x.aAge - x.bAge))} ${t("yrs")}`;
  if (x.aDob && x.bDob) {
    const za = zodiac(+x.aDob[0], +x.aDob[1]), zb = zodiac(+x.bDob[0], +x.bDob[1]);
    extra += (extra ? " · " : "") + `${t("sign")}: ${za[0]} ${za[1][lang]} & ${zb[0]} ${zb[1][lang]}`;
  }
  $("#bars").innerHTML = (extra ? `<div class="bar" style="text-align:center;opacity:.8">${extra}</div>` : "") +
    BARS.map((b, i) => `<div class="bar"><span><b>${b[lang]}</b><b>${num(x.parts[i])}%</b></span><i><b data-w="${x.parts[i]}"></b></i></div>`).join("");
  $("#tip").textContent = t("tipHead") + TIPS[x.tipIdx][lang];
  $("#res").hidden = false;
  const t0 = performance.now();
  (function tick(now) {
    const k = animate ? Math.min((now - t0) / 1600, 1) : 1, v = Math.round(x.p * (1 - Math.pow(1 - k, 3)));
    $("#ring").style.setProperty("--p", v);
    $("#pct").textContent = num(v) + "%";
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
  requestAnimationFrame(() => $$("#bars [data-w]").forEach(el => { el.style.width = el.dataset.w + "%"; }));
  if (animate) petals();
}

/* ---------------- Share & card ---------------- */
function drawCard() {
  const W = 900, H = 1100, cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const c = cv.getContext("2d"), x = last, r = resFor(x.p);
  const g = c.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#ffe3ea"); g.addColorStop(1, "#fff0d6");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.textAlign = "center"; c.fillStyle = "#2b1030";
  c.font = "700 54px 'Hind Siliguri',sans-serif";
  c.fillText(t("appName") + " 💘", W / 2, 110);
  const load = src => new Promise(res => { if (!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  return Promise.all([load(x.ap), load(x.bp)]).then(([ia, ib]) => {
    const face = (im, cx, ic) => {
      c.save(); c.beginPath(); c.arc(cx, 330, 120, 0, Math.PI * 2); c.closePath(); c.clip();
      c.fillStyle = "#fff"; c.fillRect(cx - 120, 210, 240, 240);
      if (im) c.drawImage(im, cx - 120, 210, 240, 240);
      else { c.font = "110px sans-serif"; c.fillStyle = "#2b1030"; c.fillText(ic, cx, 365); }
      c.restore();
      c.lineWidth = 8; c.strokeStyle = "#e8456b"; c.beginPath(); c.arc(cx, 330, 120, 0, Math.PI * 2); c.stroke();
    };
    face(ia, 210, "🌸"); face(ib, 690, "🌼");
    c.fillStyle = "#e8456b"; c.font = "700 150px 'Tiro Bangla',serif";
    c.fillText(num(x.p) + "%", W / 2, 380);
    c.fillStyle = "#2b1030"; c.font = "600 46px 'Hind Siliguri',sans-serif";
    c.fillText(`${x.an} ❤ ${x.bn}`, W / 2, 570);
    c.font = "500 40px 'Hind Siliguri',sans-serif";
    c.fillText(r[1][lang], W / 2, 650);
    c.font = "400 32px 'Hind Siliguri',sans-serif"; c.fillStyle = "#5b3a60";
    const words = r[2][lang].split(" "); let line = "", y = 730;
    words.forEach(w => { const tt = line + w + " "; if (c.measureText(tt).width > 760) { c.fillText(line, W / 2, y); line = w + " "; y += 44; } else line = tt; });
    c.fillText(line, W / 2, y);
    c.font = "400 26px 'Hind Siliguri',sans-serif"; c.fillStyle = "#8a6a90";
    c.fillText(t("funNote"), W / 2, H - 60);
    return cv;
  });
}
$("#cardBtn").onclick = () => drawCard().then(cv => {
  const a = document.createElement("a");
  a.download = "love-test.png"; a.href = cv.toDataURL("image/png");
  document.body.appendChild(a); a.click(); a.remove();
  toast(t("cardSaved"));
});
$("#shBtn").onclick = async () => {
  const txt = T[lang].shareTxt(last.an, last.bn, num(last.p));
  try {
    if (navigator.share) await navigator.share({ text: txt, url: location.href });
    else { await navigator.clipboard.writeText(txt + " " + location.href); toast(t("copied")); }
  } catch (e) {}
};
$("#goBtn").onclick = runTest;
$("#clBtn").onclick = () => { $("#res").hidden = true; };

/* ---------------- History (saved on this device) ---------------- */
const hk = () => "lt_hist_" + (user ? user.id : "guest");
function loadHist() { try { return JSON.parse(localStorage.getItem(hk())) || []; } catch (e) { return []; } }
function saveHist(h) {
  try { localStorage.setItem(hk(), JSON.stringify(h)); }
  catch (e) { try { localStorage.setItem(hk(), JSON.stringify(h.slice(0, 8).map(x => ({ ...x, ap: "", bp: "" })))); } catch (e2) {} }
}
function drawHist() {
  const h = loadHist();
  $("#clrBtn").hidden = !h.length;
  $("#hist").innerHTML = h.length ? h.map(x => `<div class="row" data-show="${x.id}">
    <div class="th"><i>${avHtml(x.ap, "🌸")}</i><i>${avHtml(x.bp, "🌼")}</i></div>
    <div class="tx"><b>${esc(x.an)} ❤ ${esc(x.bn)}</b><small>${esc(OPT.rel[lang][x.rel] || "")} · ${new Date(x.id).toLocaleString(lang === "bn" ? "bn-BD" : "en-GB")}</small></div>
    <strong>${num(x.p)}%</strong>
    <button class="lnk" data-del="${x.id}" aria-label="delete">✕</button></div>`).join("")
    : `<div class="empty">${t("noHist")}</div>`;
}
$("#hist").addEventListener("click", e => {
  const d = e.target.closest("[data-del]");
  if (d) { saveHist(loadHist().filter(x => String(x.id) !== d.dataset.del)); return drawHist(); }
  const r = e.target.closest("[data-show]");
  if (r) { const x = loadHist().find(v => String(v.id) === r.dataset.show); if (x) { last = x; showResult(x, false); } }
});
$("#clrBtn").onclick = () => { if (confirm(t("confirmClear"))) { saveHist([]); drawHist(); } };

/* ---------------- Sign in ---------------- */
function setUser(u) {
  user = u;
  $("#login").hidden = !!u;
  $("#app").hidden = !u;
  if (u) {
    $("#uName").textContent = u.name || t("guest");
    const im = $("#uPhoto"); im.hidden = !u.photo; if (u.photo) im.src = u.photo;
    drawHist();
  }
}
function social(mk) {
  if (!LIVE) return toast(t("needFb"));
  auth.signInWithPopup(mk()).catch(err => toast(t("signFail") + err.code));
}
$("#gBtn").onclick = () => social(() => new firebase.auth.GoogleAuthProvider());
$("#fBtn").onclick = () => social(() => new firebase.auth.FacebookAuthProvider());
$("#dBtn").onclick = () => setUser({ id: "demo", name: t("guest") });
$("#outBtn").onclick = () => { if (LIVE) auth.signOut(); setUser(null); };

build();
if (LIVE) {
  firebase.initializeApp(CFG);
  auth = firebase.auth();
  auth.onAuthStateChanged(u => setUser(u ? { id: u.uid, name: u.displayName, photo: u.photoURL } : null));
} else {
  setUser(null);
}
</script>
