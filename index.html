<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>লাভ টেস্ট – কে কাকে কতটা ভালোবাসে?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{--plum:#2b1030;--rose:#e8456b;--blush:#ffe3ea;--gold:#f6b24a;--paper:#fff8f5;--sun:#fff0d6;--line:#ecd3d9}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Hind Siliguri",system-ui,sans-serif;background:var(--paper);color:var(--plum);line-height:1.6}
h1,h2,h3{font-family:"Tiro Bangla",serif;font-weight:400;margin:0}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,var(--blush),transparent 55%),radial-gradient(circle at 85% 90%,var(--sun),transparent 50%)}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:36px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px -25px rgba(43,16,48,.35)}
.card h1{font-size:2.2rem;line-height:1.25;margin-bottom:8px}
.card p{margin:0 0 22px;opacity:.75}
.big{font-size:3rem;letter-spacing:6px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;margin-top:12px;border-radius:14px;border:1.5px solid var(--plum);background:#fff;cursor:pointer;font-weight:500}
.sbtn.fb{background:#1877f2;border-color:#1877f2;color:#fff}
.sbtn.demo{border-style:dashed;opacity:.8}
.note{font-size:.85rem;margin-top:16px;opacity:.65}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
header.top b{font-family:"Tiro Bangla",serif;font-size:1.3rem;font-weight:400}
.who{display:flex;align-items:center;gap:10px;font-size:.95rem}
.who img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.lnk{background:none;border:0;color:var(--rose);cursor:pointer;font-weight:600;padding:4px 8px}
main{max-width:1000px;margin:0 auto;padding:28px 16px 70px}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.2}
.hero p{margin:8px 0 0;opacity:.75}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{border-radius:26px;padding:22px 18px;border:1px solid var(--line)}
.panel.a{background:var(--blush)}
.panel.b{background:var(--sun)}
.panel h2{text-align:center;font-size:1.5rem;margin-bottom:14px}
.avatar{width:112px;height:112px;margin:0 auto 12px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 0 0 3px var(--rose);display:grid;place-items:center;font-size:2.6rem;overflow:hidden}
.b .avatar{box-shadow:0 0 0 3px var(--gold)}
.avatar img{width:100%;height:100%;object-fit:cover}
.pick{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.fin{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.pbtn{padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;font-size:.9rem}
.fld{margin-bottom:14px}
.fld>label,.lab{display:block;font-weight:600;font-size:.95rem;margin-bottom:6px}
.txt,select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:.92rem}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.shared{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px 18px}
.shared h2{text-align:center;font-size:1.4rem;margin-bottom:14px}
.go{display:block;margin:26px auto 0;padding:16px 44px;border:0;border-radius:999px;background:var(--rose);color:#fff;font-size:1.25rem;font-weight:600;cursor:pointer;box-shadow:0 14px 28px -12px var(--rose)}
.go:active{transform:scale(.97)}
.hist{margin-top:46px}
.hist h2{font-size:1.5rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:10px}
.row .th{display:flex}
.row .th img,.row .th i{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:var(--blush);display:grid;place-items:center;font-style:normal}
.row .th>*+*{margin-left:-12px}
.row .tx{flex:1;min-width:0}
.row .tx small{display:block;opacity:.65}
.row strong{font-family:"Tiro Bangla",serif;font-size:1.5rem;color:var(--rose);font-weight:400}
.empty{text-align:center;opacity:.6;padding:18px}
.overlay{position:fixed;inset:0;background:rgba(43,16,48,.78);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.res{background:var(--paper);border-radius:30px;padding:28px 20px;max-width:440px;width:100%;text-align:center}
.duo{display:flex;align-items:center;justify-content:center;gap:14px}
.duo .avatar{width:84px;height:84px;margin:0;font-size:2rem}
.ring{--p:0;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rose) calc(var(--p)*1%),#f3d6dc 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:"Tiro Bangla",serif;font-size:2.4rem}
.res h3{font-size:1.3rem;margin:16px 0 6px}
.res p{margin:0 0 16px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.acts button{padding:11px 22px;border-radius:999px;border:1.5px solid var(--plum);background:#fff;cursor:pointer;font-weight:600}
.acts .p{background:var(--rose);border-color:var(--rose);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--plum);color:#fff;padding:12px 20px;border-radius:14px;z-index:30;max-width:90%;text-align:center}
@media(max-width:760px){.panels{grid-template-columns:1fr}.duo{gap:6px}.ring{width:124px;height:124px}.ring div{width:96px;height:96px;font-size:2rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<!-- সাইন-ইন -->
<section id="login" class="screen" hidden>
  <div class="card">
    <div class="big">🌸💗🌼</div>
    <h1>লাভ টেস্ট</h1>
    <p>দুজনের মধ্যে ভালোবাসার পার্সেন্ট জেনে নিন। শুরু করতে সাইন ইন করুন।</p>
    <button class="sbtn" id="gBtn">Google দিয়ে সাইন ইন</button>
    <button class="sbtn fb" id="fBtn">Facebook দিয়ে সাইন ইন</button>
    <button class="sbtn demo" id="dBtn">ডেমো হিসেবে চালিয়ে যান</button>
    <div class="note" id="liveNote"></div>
  </div>
</section>

<!-- মূল অ্যাপ -->
<div id="app" hidden>
  <header class="top">
    <b>🌸 লাভ টেস্ট</b>
    <div class="who"><img id="uPhoto" alt="" hidden><span id="uName"></span><button class="lnk" id="outBtn">সাইন আউট</button></div>
  </header>
  <main>
    <div class="hero">
      <h1>কে কাকে কতটা ভালোবাসে?</h1>
      <p>ছবি যোগ করুন, অপশন বেছে নিন, তারপর টেস্ট বাটনে চাপ দিন।</p>
    </div>
    <div class="panels" id="panels"></div>
    <div class="shared" id="shared"></div>
    <button class="go" id="goBtn">💘 লাভ টেস্ট করুন</button>
    <section class="hist">
      <h2>আগের টেস্টগুলো <button class="lnk" id="clrBtn">সব মুছুন</button></h2>
      <div id="hist"></div>
    </section>
  </main>
</div>

<!-- ফলাফল -->
<div id="res" class="overlay" hidden>
  <div class="res">
    <div class="duo">
      <div class="avatar" id="rA"></div>
      <div class="ring" id="ring"><div id="pct">0%</div></div>
      <div class="avatar" id="rB"></div>
    </div>
    <h3 id="rNames"></h3>
    <p id="rMsg"></p>
    <div class="acts">
      <button class="p" id="shBtn">শেয়ার করুন</button>
      <button id="clBtn">বন্ধ করুন</button>
    </div>
    <div class="note">এটি শুধু মজার জন্য, ফলাফল র‍্যান্ডম।</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ============ Firebase সেটিংস: নিজের কনফিগ এখানে বসান ============ */
const CFG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};
/* ================================================================== */

const LIVE = !CFG.apiKey.startsWith("YOUR");
const $ = s => document.querySelector(s);
const bn = n => String(n).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
let user = null, auth = null;
const S = { a: {}, b: {}, x: {} };
let last = null;

const FIELDS = [
  { k: "age", label: "বয়স", type: "age" },
  { k: "blood", label: "রক্তের গ্রুপ", chips: ["A+", "A−", "B+", "B−", "O+", "O−", "AB+", "AB−"] },
  { k: "work", label: "বর্তমানে কী করছেন", chips: ["স্টুডেন্ট", "চাকরিজীবী", "ব্যবসায়ী", "গৃহিণী", "অন্যান্য"] },
  { k: "lang", label: "ভালোবাসা প্রকাশের ধরন", chips: ["সময় দেওয়া", "উপহার", "মিষ্টি কথা", "যত্ন নেওয়া"] }
];
const SHARED = [
  { k: "rel", label: "দুজনের সম্পর্ক", chips: ["বয়ফ্রেন্ড–গার্লফ্রেন্ড", "স্বামী–স্ত্রী", "বাবা", "মা", "ভাই", "বোন", "ছেলে", "মেয়ে", "বন্ধু", "অন্যান্য"] },
  { k: "dur", label: "কতদিনের পরিচয়", chips: ["১ মাসের কম", "১–৬ মাস", "৬ মাস–১ বছর", "১–৩ বছর", "৩ বছরের বেশি", "জন্ম থেকে"] },
  { k: "freq", label: "কত ঘনঘন দেখা বা কথা হয়", chips: ["প্রতিদিন", "সপ্তাহে কয়েকবার", "মাসে কয়েকবার", "খুব কম"] }
];

function chipsHtml(s, f) {
  return `<div class="chips">${f.chips.map(v => `<button type="button" class="chip" data-s="${s}" data-k="${f.k}" data-v="${v}">${v}</button>`).join("")}</div>`;
}
function fieldHtml(s, f) {
  let body;
  if (f.type === "age") {
    body = `<select data-s="${s}" data-k="age"><option value="">বয়স বেছে নিন</option>${Array.from({ length: 99 }, (_, i) => `<option value="${i + 1}">${bn(i + 1)} বছর</option>`).join("")}</select>`;
  } else body = chipsHtml(s, f);
  return `<div class="fld"><label>${f.label}</label>${body}</div>`;
}
function panelHtml(s, title, icon) {
  return `<section class="panel ${s}">
    <h2>${title}</h2>
    <div class="avatar" id="av-${s}">${icon}</div>
    <div class="pick">
      <button type="button" class="pbtn" data-open="g-${s}">🖼️ গ্যালারি</button>
      <button type="button" class="pbtn" data-open="c-${s}">📷 ক্যামেরা</button>
      <input type="file" accept="image/*" class="fin" id="g-${s}" data-photo="${s}">
      <input type="file" accept="image/*" capture="user" class="fin" id="c-${s}" data-photo="${s}">
    </div>
    <div class="fld"><label>${s === "a" ? "আপনার নাম" : "পার্টনারের নাম"}</label><input class="txt" data-s="${s}" data-k="name" placeholder="নাম লিখুন" maxlength="30"></div>
    ${FIELDS.map(f => fieldHtml(s, f)).join("")}
  </section>`;
}
function build() {
  $("#panels").innerHTML = panelHtml("a", "আমি (Me)", "🌸") + panelHtml("b", "আমার পার্টনার", "🌼");
  $("#shared").innerHTML = "<h2>দুজনের কথা</h2>" + SHARED.map(f => fieldHtml("x", f)).join("");
}

/* ---------- ইনপুট হ্যান্ডলিং ---------- */
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]");
  if (o) { const f = document.getElementById(o.dataset.open); if (f) { f.value = ""; f.click(); } return; }
  const c = e.target.closest(".chip");
  if (!c) return;
  const { s, k, v } = c.dataset;
  document.querySelectorAll(`.chip[data-s="${s}"][data-k="${k}"]`).forEach(x => x.classList.remove("on"));
  c.classList.add("on");
  S[s][k] = v;
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.k && !t.classList.contains("chip")) S[t.dataset.s][t.dataset.k] = t.value.trim();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.photo && t.files[0]) pickPhoto(t.dataset.photo, t.files[0]);
  if (t.tagName === "SELECT") S[t.dataset.s][t.dataset.k] = t.value;
});

function pickPhoto(s, file) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const z = 220, cv = document.createElement("canvas");
      cv.width = cv.height = z;
      const m = Math.min(img.width, img.height);
      cv.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, z, z);
      S[s].photo = cv.toDataURL("image/jpeg", 0.75);
      $("#av-" + s).innerHTML = `<img alt="" src="${S[s].photo}">`;
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function toast(t) {
  const d = document.createElement("div");
  d.className = "toast"; d.textContent = t;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}

/* ---------- ফলাফল ---------- */
const MSGS = [
  [20, "এখনো অনেক পথ বাকি। একটু বেশি সময় আর কথা বললে সব বদলে যাবে।"],
  [40, "ভালোবাসার বীজ আছে, শুধু যত্ন দরকার।"],
  [60, "মাঝারি মিল। একসাথে সময় কাটালে এটা আরও বাড়বে।"],
  [80, "দারুণ বোঝাপড়া! আপনাদের মধ্যে সত্যিই টান আছে।"],
  [95, "অসাধারণ জুটি! এমন ভালোবাসা খুব কম দেখা যায়।"],
  [100, "পারফেক্ট ম্যাচ! আপনারা একে অপরের জন্যই তৈরি।"]
];
const msgFor = p => MSGS.find(m => p <= m[0])[1];
const avHtml = (ph, ic) => ph ? `<img alt="" src="${ph}">` : ic;

function runTest() {
  if (!S.a.name || !S.b.name) return toast("দুজনেরই নাম দিন।");
  if (!S.x.rel) return toast("দুজনের সম্পর্ক বেছে নিন।");
  const p = Math.floor(Math.random() * 100) + 1;
  last = { id: Date.now(), p, an: S.a.name, bn: S.b.name, rel: S.x.rel, ap: S.a.photo || "", bp: S.b.photo || "" };
  $("#rA").innerHTML = avHtml(last.ap, "🌸");
  $("#rB").innerHTML = avHtml(last.bp, "🌼");
  $("#rNames").textContent = `${last.an} ❤ ${last.bn} (${last.rel})`;
  $("#rMsg").textContent = msgFor(p);
  $("#res").hidden = false;
  const t0 = performance.now();
  (function tick(t) {
    const k = Math.min((t - t0) / 1600, 1), v = Math.round(p * (1 - Math.pow(1 - k, 3)));
    $("#ring").style.setProperty("--p", v);
    $("#pct").textContent = bn(v) + "%";
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
  const h = loadHist(); h.unshift(last); saveHist(h.slice(0, 30)); drawHist();
}

/* ---------- রেকর্ড (এই ডিভাইসে সেভ হয়) ---------- */
const hk = () => "lt_hist_" + (user ? user.id : "guest");
function loadHist() { try { return JSON.parse(localStorage.getItem(hk())) || []; } catch (e) { return []; } }
function saveHist(h) {
  try { localStorage.setItem(hk(), JSON.stringify(h)); }
  catch (e) { try { localStorage.setItem(hk(), JSON.stringify(h.slice(0, 8).map(x => ({ ...x, ap: "", bp: "" })))); } catch (e2) {} }
}
function drawHist() {
  const h = loadHist();
  $("#clrBtn").hidden = !h.length;
  $("#hist").innerHTML = h.length ? h.map(x => `<div class="row">
    <div class="th"><i>${avHtml(x.ap, "🌸")}</i><i>${avHtml(x.bp, "🌼")}</i></div>
    <div class="tx"><b>${esc(x.an)} ❤ ${esc(x.bn)}</b><small>${esc(x.rel)} · ${new Date(x.id).toLocaleString("bn-BD")}</small></div>
    <strong>${bn(x.p)}%</strong>
    <button class="lnk" data-del="${x.id}" aria-label="মুছুন">✕</button></div>`).join("")
    : '<div class="empty">এখনো কোনো টেস্ট করা হয়নি।</div>';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
$("#hist").addEventListener("click", e => {
  const d = e.target.closest("[data-del]");
  if (d) { saveHist(loadHist().filter(x => String(x.id) !== d.dataset.del)); drawHist(); }
});
$("#clrBtn").onclick = () => { if (confirm("সব রেকর্ড মুছে ফেলবেন?")) { saveHist([]); drawHist(); } };

/* ---------- বাটন ---------- */
$("#goBtn").onclick = runTest;
$("#clBtn").onclick = () => { $("#res").hidden = true; };
$("#shBtn").onclick = async () => {
  const txt = `${last.an} ❤ ${last.bn}: আমাদের ভালোবাসার পরিমাণ ${bn(last.p)}%! 💘`;
  try {
    if (navigator.share) await navigator.share({ text: txt, url: location.href });
    else { await navigator.clipboard.writeText(txt + " " + location.href); toast("কপি হয়েছে!"); }
  } catch (e) {}
};

/* ---------- সাইন ইন ---------- */
function setUser(u) {
  user = u;
  $("#login").hidden = !!u;
  $("#app").hidden = !u;
  if (u) {
    $("#uName").textContent = u.name || "বন্ধু";
    const im = $("#uPhoto"); im.hidden = !u.photo; if (u.photo) im.src = u.photo;
    drawHist();
  }
}
function social(p) {
  if (!LIVE) return toast("আগে Firebase কনফিগ বসান, অথবা ডেমো ব্যবহার করুন।");
  auth.signInWithPopup(p).catch(err => toast("সাইন ইন হয়নি: " + err.code));
}
$("#gBtn").onclick = () => social(LIVE && new firebase.auth.GoogleAuthProvider());
$("#fBtn").onclick = () => social(LIVE && new firebase.auth.FacebookAuthProvider());
$("#dBtn").onclick = () => setUser({ id: "demo", name: "অতিথি" });
$("#outBtn").onclick = () => { if (LIVE) auth.signOut(); setUser(null); };

build();
if (LIVE) {
  firebase.initializeApp(CFG);
  auth = firebase.auth();
  auth.onAuthStateChanged(u => { setUser(u ? { id: u.uid, name: u.displayName, photo: u.photoURL } : null); });
} else {
  $("#liveNote").textContent = "ডেমো মোড: Google/Facebook চালু করতে index.html এর Firebase কনফিগ বসান।";
  setUser(null);
}
$("#login").hidden = !!user;
</script>
</body>
</html>
